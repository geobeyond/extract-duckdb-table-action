          # remove two records from test.duckdb
          duckdb test-data/test.duckdb <<'EOF'
            INSTALL spatial;
            LOAD spatial;
            DELETE FROM test_layer WHERE PROGRESSIVO_ACCESSO = 2 OR PROGRESSIVO_ACCESSO = 4;
          EOF

          # commit modified test.duckdb
          cd test-data
          git add test.duckdb
          git commit -m "Deleted record with PROGRESSIVO_ACCESSO 2 and 4"
          cd ..

      - name: "Run extract-duckdb-table-action"
        id: test
        uses: ./
        with:
          duckdb_file: "test-data/test.duckdb"
