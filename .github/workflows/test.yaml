        env:
          CURRENT_FILE: ${{ steps.test.outputs.current_file }}
          PREVIOUS_FILE: ${{ steps.test.outputs.previous_file }}
        run: |
          echo "Current File: $CURRENT_FILE"
          echo "Previous File: $PREVIOUS_FILE"

          current="test-data/"$(basename "$CURRENT_FILE")
          previous="test-data/"$(basename "$PREVIOUS_FILE")

          # dump contents of geopackage files for debugging
          echo "Contents of test_layer in current file:"
          sqlite3 "$current" "SELECT * FROM test_layer;"
          echo "Contents of test_layer in previous file:"
          sqlite3 "$previous" "SELECT * FROM test_layer;"
          echo "--------------------------------"

          # check that in both geopackage files the table exists (using sqlite3)
          TABLE_NAME="test_layer"
          if sqlite3 "$current" "SELECT table_name FROM gpkg_contents WHERE table_name = '$TABLE_NAME';" | grep -q "$TABLE_NAME"; then
            echo "Table '$TABLE_NAME' exists in current file."
          else
            echo "Error: Table '$TABLE_NAME' does not exist in current file."
            exit 1
          fi

          if sqlite3 "$previous" "SELECT table_name FROM gpkg_contents WHERE table_name = '$TABLE_NAME';" | grep -q "$TABLE_NAME"; then
            echo "Table '$TABLE_NAME' exists in previous file."
          else
            echo "Error: Table '$TABLE_NAME' does not exist in previous file."
            exit 1
          fi

          # use geodiff to compare the two geopackage files and check that the expected insertions are detected
          geodiff_output=$(tools/geodiff diff --summary "$previous" "$current")
          echo "Geodiff Output:"
          echo "$geodiff_output"

          # compare geodiff output to expected values
          expected_json='{
            "geodiff_summary": [
              {
                "delete": 0,
                "insert": 2,
                "table": "test_layer",
                "update": 0
              }
            ]
          }'
          # remove whitespace for comparison
          geodiff_output_compact=$(echo "$geodiff_output" | tr -d ' \n\r\t')
          expected_json_compact=$(echo "$expected_json" | tr -d ' \n\r\t')

          if [[ "$geodiff_output_compact" == *"$expected_json_compact"* ]]; then
            echo "Geodiff output matches expected summary."
          else
            echo "Error: Geodiff output does not match expected summary."
            exit 1
          fi
