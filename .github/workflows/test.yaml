name: "Test"

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/test.yaml"
      - "src/**"
      - "action.yml"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-extract-between-commit:
    name: "Text extract between two commits"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Debug event.json"
        if: ${{ !github.event.act }}
        continue-on-error: true
        run: cat "${GITHUB_EVENT_PATH}"

      - name: "Debug Environment"
        if: ${{ !github.event.act }}
        continue-on-error: true
        run: env

      - name: "Install DuckDB CLI"
        run: |
          wget https://github.com/duckdb/duckdb/releases/download/v1.4.3/duckdb_cli-linux-amd64.zip
          unzip duckdb_cli-linux-amd64.zip
          chmod +x duckdb
          mv duckdb /usr/local/bin/duckdb

      - name: "Install SQLite3 (if missing)"
        run: |
          if command -v sqlite3 >/dev/null 2>&1; then
            echo "sqlite3 already installed: $(sqlite3 --version)"
          else
            sudo apt-get update
            sudo apt-get install -y sqlite3
          fi

      - name: "Create DuckDB with commit history"
        run: |
          mkdir -p test-data
          # Create base GeoPackage with sqlite3
          sqlite3 test-data/base.gpkg <<'EOF'
            CREATE TABLE gpkg_spatial_ref_sys (srs_name TEXT NOT NULL, srs_id INTEGER NOT NULL PRIMARY KEY, organization TEXT NOT NULL, organization_coordsys_id INTEGER NOT NULL, definition TEXT NOT NULL, description TEXT);
            CREATE TABLE gpkg_contents (table_name TEXT NOT NULL PRIMARY KEY, data_type TEXT NOT NULL, identifier TEXT UNIQUE, description TEXT DEFAULT '', last_change DATETIME NOT NULL DEFAULT (strftime('%Y-%m-%dT%H:%M:%fZ','now')), min_x DOUBLE, min_y DOUBLE, max_x DOUBLE, max_y DOUBLE, srs_id INTEGER);
            CREATE TABLE gpkg_geometry_columns (table_name TEXT NOT NULL, column_name TEXT NOT NULL, geometry_type_name TEXT NOT NULL, srs_id INTEGER NOT NULL, z TINYINT NOT NULL, m TINYINT NOT NULL, CONSTRAINT pk_geom_cols PRIMARY KEY (table_name, column_name));
            INSERT INTO gpkg_spatial_ref_sys VALUES ('WGS 84', 4326, 'EPSG', 4326, 'GEOGCS["WGS 84",DATUM["WGS_1984",SPHEROID["WGS 84",6378137,298.257223563]],PRIMEM["Greenwich",0],UNIT["degree",0.0174532925199433]]', NULL);
            CREATE TABLE test_layer (fid INTEGER PRIMARY KEY AUTOINCREMENT, geom BLOB, name TEXT);
            INSERT INTO gpkg_contents VALUES ('test_layer', 'features', 'test_layer', '', datetime('now'), NULL, NULL, NULL, NULL, 4326);
            INSERT INTO gpkg_geometry_columns VALUES ('test_layer', 'geom', 'POINT', 4326, 0, 0);
            INSERT INTO test_layer (fid, name) VALUES (1, 'Point A');
            INSERT INTO test_layer (fid, name) VALUES (2, 'Point B');
          EOF

          duckdb test-data/test.duckdb <<'EOF'
            INSTALL sqlite;
            LOAD sqlite;
            CREATE OR REPLACE TABLE test_layer AS
              SELECT * FROM sqlite_scan('test-data/base.gpkg', 'test_layer');
            SELECT * FROM test_layer;
          EOF

          # create git repository for testing git history mode
          git init test-data
          cd test-data
          git config user.email "test@example.com"
          git config user.name "Test User"

          # add test.duckdb to git
          git add test.duckdb
          git commit -m "Add base duckdb filled with base.gpkg data"
          cd ..

          # modify test.duckdb to reflect changes in compare.gpkg
          duckdb test-data/test.duckdb <<'EOF'
            INSTALL spatial;
            LOAD spatial;
            DELETE FROM test_layer WHERE fid = 2;
            UPDATE test_layer SET name = 'Point A Modified' WHERE fid = 1;
            INSERT INTO test_layer (fid, name) VALUES (3, 'Point C');
          EOF

          # commit modified test.duckdb
          cd test-data
          git add test.duckdb
          git commit -m "Modify duckdb to reflect changes in compare.gpkg"
          cd ..

      - name: "Test Local Action"
        id: test
        uses: ./
        with:
          duckdb_file: "test-data/test.duckdb"
          table_name: "test_layer"
          output_format: "GPKG"

      - name: "Check Outputs"
        env:
          CURRENT_FILE: ${{ steps.test.outputs.current_file }}
          PREVIOUS_FILE: ${{ steps.test.outputs.previous_file }}
        run: |
          # check if output files exist
          if [ ! -f "$CURRENT_FILE" ]; then
            echo "Current file does not exist: $CURRENT_FILE"
            exit 1
          fi
          if [ ! -f "$PREVIOUS_FILE" ]; then
            echo "Previous file does not exist: $PREVIOUS_FILE"
            exit 1
          fi
          echo "Current and previous files exist."

          # dump content of output files dumping table content in a out file using sqlite
          echo "Content of Current File:"
          table_name=$(basename "$CURRENT_FILE" .gpkg)
          sqlite3 "$CURRENT_FILE" <<EOF > current_file_content.txt
            SELECT * FROM "$table_name";
          EOF
          # alternatively using ogrinfo
          #
          # ogrinfo "$CURRENT_FILE" -sql "SELECT * FROM \"$table_name\"" > current_file_content.txt
          cat current_file_content.txt

          # dump content of previous file dumping table content using sqlite
          echo "Content of Previous File:"
          table_name=$(basename "$PREVIOUS_FILE" .gpkg)
          sqlite3 "$PREVIOUS_FILE" <<EOF > previous_file_content.txt
            SELECT * FROM "$table_name";
          EOF
          # alternatively using ogrinfo
          #
          # ogrinfo "$PREVIOUS_FILE" -sql "SELECT * FROM \"$table_name\"" > previous_file_content.txt
          cat previous_file_content.txt

          # dump md5 checksums
          MD5_CURRENT=$(md5sum current_file_content.txt | awk '{ print $1 }')
          MD5_PREVIOUS=$(md5sum previous_file_content.txt | awk '{ print $1 }')
          echo "MD5 Current File: $MD5_CURRENT"
          echo "MD5 Previous File: $MD5_PREVIOUS"

          # verify md5 checksum of current file matches expected value
          EXPECTED_MD5_CURRENT="3e89518355f963d3eba4c1de3274b84c"
          if [ "$MD5_CURRENT" != "$EXPECTED_MD5_CURRENT" ]; then
            echo "Error: MD5 checksum of current file does not match expected value."
            exit 1
          else
            echo "MD5 checksum of current file matches expected value."
          fi

          # verify md5 checksum of previous file matches expected value
          EXPECTED_MD5_PREVIOUS="f0c39666fa36aed0666fbc38f93d284e"
          if [ "$MD5_PREVIOUS" != "$EXPECTED_MD5_PREVIOUS" ]; then
            echo "Error: MD5 checksum of previous file does not match expected value."
            exit 1
          else
            echo "MD5 checksum of previous file matches expected value."
          fi